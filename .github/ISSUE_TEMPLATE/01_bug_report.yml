name: Bug report
description: liveness_primer crashed, produced a wrong report, or behaved differently than documented.
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A bug in liveness_primer is typically
        reproducible from a single command plus the two detector refs, so the
        fields below are what a maintainer needs to see it happen.

        Security issues should go through
        [SECURITY.md](https://github.com/mcdigman/liveness_primer/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: liveness_primer version
      description: Output of `liveness-primer --version` (it includes the schema version)
      placeholder: 'liveness-primer 0.1.0 (schema 2.2.0)'
    validations:
      required: false

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: 'Python 3.12.8'
    validations:
      required: false

  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: 'macOS 14.5 (arm64) / Ubuntu 24.04 (x86_64) / ubuntu-latest GitHub runner'
    validations:
      required: false

  - type: input
    id: detector
    attributes:
      label: Detector and revisions
      description: The `--tool` name, repo and the versions or full pinned hashes of the 2 commits that reproduce the bug, if applicable
      placeholder: 'skylos https://github.com/duriantaco/skylos a27bd86223a948fe292677e71bd84e19c1ab24fa e25b12eba4a2f80ad031b388ec81049d46be8f90'
    validations:
      required: false

  - type: input
    id: targets
    attributes:
      label: Corpus projects involved
      description: The `-k` selections, `--all`, or the `--project` URL. If only some projects fail, say which.
      placeholder: '-k pluggy (also fails on attrs; passes on click)'
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: Reproduction
      description: If possible, minimal code example that reproduces the bug, and the exact command needed to run it.
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected, and where that expectation comes from (docs, `--help`, a prior version).
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead. Paste the terminal output or traceback — the whole thing, not just the last line. Redact paths or tokens if you need to.
      render: shell
    validations:
      required: false

  - type: textarea
    id: report
    attributes:
      label: Report excerpt
      description: |
        If the bug is about report content rather than a crash, attach the JSON report (`--json-out report.json`) or paste the relevant entry. Drag-and-drop works for files.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Additional context, screenshots, link to failing CI run, etc.
    validations:
      required: false
