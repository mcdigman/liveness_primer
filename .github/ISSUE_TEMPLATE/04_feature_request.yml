name: Feature request
description: Propose new behavior, a CLI or report change, or an improvement to existing output.
title: '[feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Please open the issue before writing the code — this project has
        strict gates and a deliberately narrow scope, and agreeing on the
        shape first saves a review round.

        New detector support belongs in the **Detector adapter request** form;
        new target projects belong in **Corpus suggestion**.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and where does the current behavior get in the way? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What `liveness_primer` should do instead. Concrete beats abstract — a sample command, a sample line of output, a sample report field.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing flags, post-processing the JSON report, or doing it outside the tool — and why those fall short.
    validations:
      required: false

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility
      description: Would this change existing output, defaults, or exit codes for someone already using the tool? If so, say how it could land without breaking them.
    validations:
      required: false
