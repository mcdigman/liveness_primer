name: Dead Code

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deadcode-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

# All jobs only read the repo; none need a writable GITHUB_TOKEN, so pin the
# default token to read-only.
permissions:
  contents: read

jobs:
  skylos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-glob: "**/pyproject.toml"

      # Dead-code / unreachable-symbol detection. Run unpinned (like the other
      # uvx-based checks) so CI tracks the current release.
      - name: Run skylos
        run: uvx skylos liveness_primer tests
