name: Schemas

# Contract §7: pydantic models are the source of truth; this check enforces
# that the exported JSON Schema files in liveness_primer/schemas/ match the
# models (`schema export` regenerates them).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: schemas-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install project
        run: |
          uv venv
          uv pip install .

      - name: Regenerate schemas
        run: .venv/bin/liveness-primer schema export

      # `git diff` inspects tracked files only, so a schema exported for a
      # newly added model but never committed is invisible to it: the check
      # passed while the document was missing from the repository entirely.
      # Recording untracked files as intent-to-add first brings them into
      # the comparison, and the diff still names what moved.
      - name: Fail if the exported schemas changed
        run: |
          git add --intent-to-add -- liveness_primer/schemas/
          git diff --exit-code -- liveness_primer/schemas/
