name: Schemas

# Contract §7: pydantic models are the source of truth; this check enforces
# that the exported JSON Schema files in liveness_primer/schemas/ match the
# models (`schema export` regenerates them).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: schemas-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install project
        run: |
          uv venv
          uv pip install .

      # `schema export` defaults to the schema directory of the *imported*
      # package. This job installs non-editable, so that default is the
      # copy under .venv/ and the checkout would never change: the diff
      # below was clean by construction and the check could not fail.
      # Naming the checkout directory explicitly keeps the comparison
      # honest whatever the install mode.
      - name: Regenerate schemas
        run: .venv/bin/liveness-primer schema export --output-dir liveness_primer/schemas

      # `git diff` inspects tracked files only, so a schema exported for a
      # newly added model but never committed is invisible to it: the check
      # passed while the document was missing from the repository entirely.
      # Recording untracked files as intent-to-add first brings them into
      # the comparison, and the diff still names what moved.
      - name: Fail if the exported schemas changed
        run: |
          git add --intent-to-add -- liveness_primer/schemas/
          git diff --exit-code -- liveness_primer/schemas/
