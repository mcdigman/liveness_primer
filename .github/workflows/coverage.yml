name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  # Minimum combined line+branch coverage (coverage.py's --fail-under compares the
  # total, which reaches 100 only when both line and branch coverage are complete).
  # main requires a perfect gate; dev (and any other branch) allows some slack so
  # in-progress work can land, with the remaining gap closed before promotion.
  MAIN_COVERAGE: "100"
  DEV_COVERAGE: "95"

# All jobs only read the repo; none need a writable GITHUB_TOKEN, so pin the
# default token to read-only.
permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-glob: "**/pyproject.toml"

      # Install the project with its dev extra
      # plus coverage into a venv so tests run against the real
      # installed package (the runner's system Python is externally managed, so
      # --system installs are rejected). coverage is left unpinned like the other
      # tool installs so CI tracks the current release.
      - name: Install project with coverage
        run: |
          uv venv
          uv pip install ".[dev]" coverage

      - name: Run tests under coverage
        run: .venv/bin/python -m coverage run --branch --source=liveness_primer --omit='*/demos/*' -m pytest

      # Pick the coverage gate from the target branch: PRs use github.base_ref
      # (the branch being merged into); pushes fall back to github.ref_name. main
      # requires 100%, every other target uses the dev threshold. Then print the
      # report and fail the job if total coverage drops below that gate.
      # The ref is passed through env rather than interpolated into the script,
      # so a branch name containing shell metacharacters is compared, not run.
      - name: Coverage report
        env:
          TARGET_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          target="${TARGET_REF}"
          if [ "$target" = "main" ]; then
            thresh="${MAIN_COVERAGE}"
          else
            thresh="${DEV_COVERAGE}"
          fi
          echo "Coverage gate for '${target}': ${thresh}%"
          .venv/bin/python -m coverage report -m --fail-under="${thresh}"

      # Emit machine- and human-readable reports for inspection / external tools.
      - name: Generate coverage artifacts
        if: ${{ !cancelled() }}
        run: |
          .venv/bin/python -m coverage xml
          .venv/bin/python -m coverage html

      # The implicit success gate prevents partial reports from failed tests
      # reaching the public badge. Coveralls availability is advisory.
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329  # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.xml
          format: cobertura
          fail-on-error: false
          coverage-reporter-version: v0.6.17

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
