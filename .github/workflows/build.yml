name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# All jobs only read the repo; none need a writable GITHUB_TOKEN, so pin the
# default token to read-only.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"
          cache-dependency-glob: "**/pyproject.toml"

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  install:
    # Confirm the built wheel installs and imports across every supported
    # Python, both at the declared dependency floor and against the latest
    # releases. Python 3.15 remains an advisory preview until its final release.
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            resolution: lowest-direct
          - python-version: "3.13"
            resolution: highest
          - python-version: "3.14"
            resolution: highest
          # Advisory candidate for the next declared-support version; see the
          # matrix job in test.yml for why "3.15" is not blocking yet.
          - python-version: "3.15"
            resolution: highest
            experimental: true
    name: install (py${{ matrix.python-version }}, ${{ matrix.resolution }})
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054f94d8a5b11f265b73ba33  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: "dist/*.whl"

      - name: Install built wheel (${{ matrix.resolution }} resolution)
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --resolution ${{ matrix.resolution }} dist/*.whl

      - name: Import check
        run: .venv/bin/python -I -c "import liveness_primer"
