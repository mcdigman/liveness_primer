    repo: https://github.com/python-attrs/attrs
    license: MIT
    pin: f06ceaafbe5bdbdafad8a0c01a2daabb89386a42
    tools:
      vulture:
        targets:
          - src
        cost: 1.0
      skylos:
        analyses:
          - danger
          - secrets
          - quality
          - ai-defects
        targets:
          - src
        cost: 4.0

