# The liveness_primer corpus (contract §5).
#
# Human-authored; parsed with PyYAML and validated by `liveness-primer
# corpus validate` (pydantic models are the source of truth). Every project
# is GitHub-hosted, permissively licensed per the §6 allowlist, actively
# maintained, and moderate-size. Pins are full commit SHAs so both detector
# revisions analyze byte-identical checkouts; declared costs are approximate
# CPU-seconds on the reference runner (measured actuals land in the report).

